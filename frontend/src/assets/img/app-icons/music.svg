<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Music">
  <defs>
    <linearGradient id="muBg" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#2BE86B"/>
      <stop offset="0.5" stop-color="#1DB954"/>
      <stop offset="1" stop-color="#12833A"/>
    </linearGradient>
    <radialGradient id="muBgLight" cx="0.32" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="muBgFloor" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0" stop-color="#022B12" stop-opacity="0"/>
      <stop offset="1" stop-color="#022B12" stop-opacity="0.16"/>
    </linearGradient>

    <linearGradient id="muGlyph" gradientUnits="userSpaceOnUse" x1="61" y1="0" x2="451" y2="512">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#F6FFF9"/>
      <stop offset="1" stop-color="#DDF3E4"/>
    </linearGradient>

    <filter id="muDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="8" stdDeviation="9" flood-color="#03361A" flood-opacity="0.34"/>
    </filter>

    <filter id="muRelief" x="-30%" y="-30%" width="160%" height="160%">
      <feOffset in="SourceAlpha" dx="-5" dy="-7" result="sOff"/>
      <feGaussianBlur in="sOff" stdDeviation="7" result="sBlur"/>
      <feComposite in="SourceAlpha" in2="sBlur" operator="out" result="sMask"/>
      <feFlood flood-color="#6FB187" flood-opacity="0.42" result="sCol"/>
      <feComposite in="sCol" in2="sMask" operator="in" result="innerShadow"/>

      <feOffset in="SourceAlpha" dx="5" dy="7" result="lOff"/>
      <feGaussianBlur in="lOff" stdDeviation="6" result="lBlur"/>
      <feComposite in="SourceAlpha" in2="lBlur" operator="out" result="lMask"/>
      <feFlood flood-color="#FFFDF6" flood-opacity="0.85" result="lCol"/>
      <feComposite in="lCol" in2="lMask" operator="in" result="innerLight"/>

      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="innerShadow"/>
        <feMergeNode in="innerLight"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#muBg)"/>
  <rect width="512" height="512" fill="url(#muBgFloor)"/>
  <rect width="512" height="512" fill="url(#muBgLight)"/>

  <g filter="url(#muDrop)">
    <g filter="url(#muRelief)">
      <g fill="none" stroke="url(#muGlyph)" stroke-linecap="round">
        <path d="M104 212a280 280 0 0 1 304 0" stroke-width="54"/>
        <path d="M144 286a270 270 0 0 1 240 0" stroke-width="46"/>
        <path d="M184 354a230 230 0 0 1 176 0" stroke-width="40"/>
      </g>
    </g>
  </g>
</svg>
