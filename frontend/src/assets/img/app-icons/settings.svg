<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Settings">
  <defs>
    <!-- Meme aplatissement de fond que le telephone. -->
    <linearGradient id="sBg" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#A2A8AF"/>
      <stop offset="0.5" stop-color="#8B9199"/>
      <stop offset="1" stop-color="#6B7178"/>
    </linearGradient>
    <radialGradient id="sBgLight" cx="0.32" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sBgFloor" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0" stop-color="#23272C" stop-opacity="0"/>
      <stop offset="1" stop-color="#23272C" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="sGlyph" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#F4F6F8"/>
      <stop offset="1" stop-color="#C8CDD3"/>
    </linearGradient>

    <!-- Meme langage d ombre que le telephone, cale sur l app Messages. -->
    <filter id="sDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="8" stdDeviation="9" flood-color="#242930" flood-opacity="0.38"/>
    </filter>

    <filter id="sRelief" x="-30%" y="-30%" width="160%" height="160%">
      <feOffset in="SourceAlpha" dx="-5" dy="-7" result="sOff"/>
      <feGaussianBlur in="sOff" stdDeviation="7" result="sBlur"/>
      <feComposite in="SourceAlpha" in2="sBlur" operator="out" result="sMask"/>
      <feFlood flood-color="#858B93" flood-opacity="0.48" result="sCol"/>
      <feComposite in="sCol" in2="sMask" operator="in" result="innerShadow"/>

      <feOffset in="SourceAlpha" dx="5" dy="7" result="lOff"/>
      <feGaussianBlur in="lOff" stdDeviation="6" result="lBlur"/>
      <feComposite in="SourceAlpha" in2="lBlur" operator="out" result="lMask"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.85" result="lCol"/>
      <feComposite in="lCol" in2="lMask" operator="in" result="innerLight"/>

      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="innerShadow"/>
        <feMergeNode in="innerLight"/>
      </feMerge>
    </filter>

    <mask id="sGearHole">
      <rect width="512" height="512" fill="#000"/>
      <g fill="#fff">
        <rect x="224" y="86" width="64" height="340" rx="22"/>
        <rect x="224" y="86" width="64" height="340" rx="22" transform="rotate(45 256 256)"/>
        <rect x="224" y="86" width="64" height="340" rx="22" transform="rotate(90 256 256)"/>
        <rect x="224" y="86" width="64" height="340" rx="22" transform="rotate(135 256 256)"/>
        <circle cx="256" cy="256" r="136"/>
      </g>
      <circle cx="256" cy="256" r="58" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" fill="url(#sBg)"/>
  <rect width="512" height="512" fill="url(#sBgFloor)"/>
  <rect width="512" height="512" fill="url(#sBgLight)"/>

  <g filter="url(#sDrop)">
    <g filter="url(#sRelief)">
      <rect width="512" height="512" fill="url(#sGlyph)" mask="url(#sGearHole)"/>
    </g>
  </g>
</svg>
