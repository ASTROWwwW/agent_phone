<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Picstagram">
  <defs>
    <!-- Degrade diagonal violet vers corail, propre a Picstagram. -->
    <linearGradient id="piBg" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="472" y2="512">
      <stop offset="0" stop-color="#A45CFF"/>
      <stop offset="0.52" stop-color="#E14BC8"/>
      <stop offset="1" stop-color="#FF7A5C"/>
    </linearGradient>
    <radialGradient id="piBgLight" cx="0.3" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="piBgFloor" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0" stop-color="#3B0A44" stop-opacity="0"/>
      <stop offset="1" stop-color="#3B0A44" stop-opacity="0.18"/>
    </linearGradient>

    <linearGradient id="piGlyph" gradientUnits="userSpaceOnUse" x1="61" y1="0" x2="451" y2="512">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FDF7FF"/>
      <stop offset="1" stop-color="#EBD9F4"/>
    </linearGradient>

    <filter id="piDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="8" stdDeviation="9" flood-color="#4A0A44" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#piBg)"/>
  <rect width="512" height="512" fill="url(#piBgFloor)"/>
  <rect width="512" height="512" fill="url(#piBgLight)"/>

  <!-- Cadre au trait, relief et soleil pleins : la silhouette reste ouverte en
       bas, la ou une vignette pleine evidee par le relief mangeait ses coins. -->
  <g filter="url(#piDrop)">
    <rect
      x="126"
      y="126"
      width="260"
      height="260"
      rx="62"
      fill="none"
      stroke="url(#piGlyph)"
      stroke-width="34"
    />
    <circle cx="197" cy="203" r="23" fill="url(#piGlyph)"/>
    <path d="M165 356 226 278 268 330 306 286 350 356Z" fill="url(#piGlyph)"/>
  </g>
</svg>
